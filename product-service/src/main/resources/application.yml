spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # auto create table
    show-sql: true
    defer-datasource-initialization: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1800000ms

  sql:
    init:
      mode: always

product:
  cache:
    ttl: 1800000  # 缓存过期时间(ms), 默认30分钟, 用于存储正常商品数据